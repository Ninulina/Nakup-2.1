<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nákup 2.1</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <h1>🛒 Nákup 2.1</h1>

        <button id="darkModeBtn">
            🌙
        </button>
    </header>



    <main>

        <section>

            <h2>Nový nákup</h2>


            <label>
                Datum:
            </label>

            <input type="date" id="datum">


            <label>
                Osoba:
            </label>

            <select id="osoba">
            </select>


            <label>
                Částka:
            </label>

            <input 
                type="number"
                id="castka"
                placeholder="Kč">


            <label>
                Poznámka:
            </label>

            <input
                type="text"
                id="poznamka"
                placeholder="Poznámka">


            <button id="ulozit">
                Přidat nákup
            </button>

        </section>



        <section>

            <h2>Seznam nákupů</h2>


            <table>

                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Osoba</th>
                        <th>Částka</th>
                        <th>Poznámka</th>
                        <th>Akce</th>
                    </tr>
                </thead>


                <tbody id="tabulkaNakupu">

                </tbody>


            </table>

        </section>


    </main>


<script src="app.js"></script>

</body>

</html>
