<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nákup 2.1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🛒 Nákup 2.1</h1>


    <section>

        <label>
            Datum:
            <input type="date" id="datum">
        </label>


        <label>
            Osoba:
            <select id="osoba">
                <option value="A">A</option>
                <option value="S">S</option>
                <option value="K">K</option>
                <option value="N">N</option>
                <option value="D">D</option>
            </select>
        </label>


        <label>
            Částka:
            <input 
                type="number" 
                id="castka" 
                placeholder="Kč">
        </label>


        <label>
            Poznámka:
            <input 
                type="text" 
                id="poznamka" 
                placeholder="Poznámka">
        </label>


        <button id="ulozit">
            Uložit nákup
        </button>

    </section>



    <h2>📋 Přehled nákupů</h2>


    <table>

        <thead>

            <tr>
                <th>Datum</th>
                <th>Osoba</th>
                <th>Částka</th>
                <th>Poznámka</th>
                <th>Akce</th>
            </tr>

        </thead>


        <tbody id="tabulka">
        </tbody>


    </table>


</div>


<script src="app.js"></script>

</body>

</html>
